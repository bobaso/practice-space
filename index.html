
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボールが跳ねる</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="animation-area"></div>

    <script>
        fetch("ball.svg")
            .then(response => response.text())
            .then(svgText => {
                document.getElementById("animation-area").innerHTML = svgText;
            });
    </script>

</body>
</html>
