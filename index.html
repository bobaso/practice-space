
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボールが跳ねる</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="animation-area"></div>

   


<script>
    fetch("ball.svg")
        .then(response => response.text())
        .then(svgText => {

            document.getElementById("animation-area").innerHTML = svgText;

            const ball = document.getElementById("ball1");

            let startTime = null;

            // バウンドの高さと時間
            const bounces = [
                { height: 110, duration: 650 },
                { height: 70, duration: 550 },
                { height: 40, duration: 450 },
                { height: 20, duration: 380 }
            ];

            // 最初の落下時間
            const fallDuration = 600;

            // 地面に接触する位置
            const groundY = 178;

            // ボールの位置と形を更新
            function updateBall(y, rx, ry) {
                ball.setAttribute("cy", 100 + y + (40 - ry));
                ball.setAttribute("rx", rx);
                ball.setAttribute("ry", ry);
            }

            function animate(timestamp) {

                if (!startTime) {
                    startTime = timestamp;
                }

                const elapsed = timestamp - startTime;

                let y = 0;
                let rx = 40;
                let ry = 40;

                // 最初の落下
                if (elapsed < fallDuration) {

                    const t = elapsed / fallDuration;

                    y = groundY * t * t;

                    if (t > 0.85) {
                        const squash = (t - 0.85) / 0.15;
                        rx = 40 + 8 * squash;
                        ry = 40 - 10 * squash;
                    }

                } else {

                    // 落下後の経過時間
                    let time = elapsed - fallDuration;

                    let currentBounce = null;

                    // 現在のバウンドを探す
                    for (const bounce of bounces) {

                        if (time < bounce.duration) {
                            currentBounce = bounce;
                            break;
                        }

                        time -= bounce.duration;
                    }

                    if (currentBounce) {

                        const t = time / currentBounce.duration;

                        y = groundY -
                            currentBounce.height * 4 * t * (1 - t);

                        // 着地の前後でつぶれる
                        const impact = Math.max(
                            0,
                            1 - Math.min(t, 1 - t) / 0.12
                        );

                        rx = 40 + 8 * impact;
                        ry = 40 - 10 * impact;

                    } else {

                        // 最後は地面で静止
                        y = groundY;
                        rx = 40;
                        ry = 40;
                    }
                }

                updateBall(y, rx, ry);

                // 全てのバウンドが終わったら停止
                const totalDuration = fallDuration +
                    bounces.reduce((sum, bounce) => {
                        return sum + bounce.duration;
                    }, 0);

                if (elapsed < totalDuration) {
                    requestAnimationFrame(animate);
                }
            }

            requestAnimationFrame(animate);
        });
</script>



</body>
</html>
