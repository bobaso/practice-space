
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第3回 花の線画アニメーション</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f8f8;
        }

        #flower-container {
            width: min(600px, 100%);
        }

        #flower-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        #flower-svg path {
            stroke: #000;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #flower-svg path.is-drawing {
            animation: draw 6s ease forwards;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>

<body>

    <div id="flower-container"></div>

    <script>
        fetch("名称未設定-1.svg")
            .then(response => {
                if (!response.ok) {
                    throw new Error("SVGファイルを読み込めませんでした");
                }
                return response.text();
            })
            .then(svgText => {

                const parser = new DOMParser();

                const svgDocument = parser.parseFromString(
                    svgText,
                    "image/svg+xml"
                );

                const svg = svgDocument.documentElement;

                svg.setAttribute("id", "flower-svg");

                document
                    .getElementById("flower-container")
                    .appendChild(
                        document.importNode(svg, true)
                    );

                const flowerPath = document.querySelector(
                    "#flower-svg path"
                );

                const length = flowerPath.getTotalLength();

                flowerPath.style.strokeDasharray = length;
                flowerPath.style.strokeDashoffset = length;

                requestAnimationFrame(() => {
                    flowerPath.classList.add("is-drawing");
                });

            })
            .catch(error => {
                console.error(error);
            });
    </script>

</body>
</html>
