
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SVG Animation Practice 01</title>

    <style>

/* =================================
   ページ全体
================================= */

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f5f3ee;
}


/* =================================
   アニメーション表示エリア
================================= */

.animation-area {
    width: 600px;
    max-width: 100%;
    aspect-ratio: 3 / 2;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =================================
   SVG風船
================================= */

.balloon {

    width: 100%;
    height: 100%;

    object-fit: contain;

    animation: float 3s ease-in-out infinite;
}


/* =================================
   上下に浮かぶアニメーション
================================= */

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-30px);
    }

}

    </style>

</head>


<body>

    <div class="animation-area">

        <img
            src="balloon.svg"
            alt="赤い風船"
            class="balloon">

    </div>

</body>

</html>
