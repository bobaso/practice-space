
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第4回 蝶の羽ばたき</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f8f8;
        }

        #butterfly-container {
            width: min(600px, 100%);
        }

        #butterfly-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 左の羽 */
        #left_Feather {
            transform-box: view-box;
            transform-origin: 282px 185px;
            animation: leftFlap 1s ease-in-out infinite alternate;
        }

        /* 右の羽 */
        #right_Feather {
            transform-box: view-box;
            transform-origin: 317px 185px;
            animation: rightFlap 1s ease-in-out infinite alternate;
        }

        @keyframes leftFlap {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-35deg);
            }
        }

        @keyframes rightFlap {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(35deg);
            }
        }
    </style>
</head>

<body>

    <div id="butterfly-container"></div>

    <script>
        fetch("butterfly.svg")
            .then(response => {
                if (!response.ok) {
                    throw new Error("SVGファイルを読み込めませんでした");
                }

                return response.text();
            })
            .then(svgText => {

                const parser = new DOMParser();

                const svgDocument = parser.parseFromString(
                    svgText,
                    "image/svg+xml"
                );

                const svg = svgDocument.documentElement;

                svg.setAttribute("id", "butterfly-svg");

                document
                    .getElementById("butterfly-container")
                    .appendChild(
                        document.importNode(svg, true)
                    );

            })
            .catch(error => {
                console.error(error);
            });
    </script>

</body>
</html>
