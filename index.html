
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボールが跳ねる</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="animation-area"></div>

   

<script>
    fetch("ball.svg")
        .then(response => response.text())
        .then(svgText => {

            document.getElementById("animation-area").innerHTML = svgText;

            const ball = document.getElementById("ball1");

            let startTime = null;

            function animate(timestamp) {

                if (!startTime) {
                    startTime = timestamp;
                }

                const elapsed = (timestamp - startTime) % 1500;
                const progress = elapsed / 1500;

                let y = 0;
                let rx = 40;
                let ry = 40;

                if (progress < 0.4) {

                    const t = progress / 0.4;

                    y = 178 * t * t;

                    if (progress > 0.32) {
                        const squash = (progress - 0.32) / 0.08;

                        rx = 40 + 8 * squash;
                        ry = 40 - 10 * squash;
                    }

                } else {

                    const t = (progress - 0.4) / 0.6;

                    y = 178 - 108 * (1 - (1 - t) * (1 - t));

                    if (progress < 0.5) {
                        const stretch = 1 - (progress - 0.4) / 0.1;

                        rx = 48 - 12 * stretch;
                        ry = 30 + 18 * stretch;
                    }
                }

                ball.setAttribute("cy", 100 + y);
                ball.setAttribute("rx", rx);
                ball.setAttribute("ry", ry);

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        });
</script>



</body>
</html>
